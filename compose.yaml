name: fromage

services:
  searxng:
    image: docker.io/searxng/searxng:2026.10.4-d48c4b555
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: docker.io/ollama/ollama:0.35.1
    restart: unless-stopped
    # Not published: only the mcp service talks to it, and a host Ollama often already owns 11434.
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: docker.io/ollama/ollama:0.35.1
    depends_on:
      - ollama
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "waiting for ollama..."
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull nomic-embed-text
        echo "nomic-embed-text ready"

  mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    # Defaults live in the Dockerfile; override any FROMAGE_* variable here under `environment:`.
    volumes:
      - mcp_data:/data
    depends_on:
      searxng:
        condition: service_started
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

  # Optional vector DB: docker compose --profile vector up -d
  qdrant:
    profiles: ["vector"]
    image: docker.io/qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  ollama_data:
  mcp_data:
  qdrant_data:
