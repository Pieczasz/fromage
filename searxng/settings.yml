use_default_settings: true

server:
  # Fine as a fixed value: SearXNG only listens on 127.0.0.1 and has no user accounts.
  secret_key: "fromage-local-only"
  limiter: false

search:
  formats:
    - html
    - json

engines:
  - name: mdn
    disabled: true
  - name: docker hub
    disabled: true
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: microsoft learn
    disabled: false
  - name: npm
    disabled: false
  - name: pkg.go.dev
    disabled: false
  - name: crates.io
    disabled: false
  - name: huggingface
    disabled: false
  - name: hackernews
    disabled: false
